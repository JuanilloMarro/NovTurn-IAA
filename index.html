<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <!-- `viewport-fit=cover` es obligatorio para que `env(safe-area-inset-*)`
             devuelva algo distinto de 0 en iOS. Sin esto, las reglas de área
             segura de `index.css` no hacen nada y el contenido se mete debajo
             del notch y del indicador de inicio. -->
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, viewport-fit=cover"
        />
        <title>Acceso Seguro</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
            rel="stylesheet"
        />
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.jsx"></script>
    </body>
</html>
